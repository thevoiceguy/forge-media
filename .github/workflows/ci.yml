name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-${{ matrix.rust }}-
            ${{ runner.os }}-cargo-build-target-

      - name: Run tests
        # `--workspace` with path-dep submodule compiles tests for the
        # siphon-rs submodule's own test targets, which aren't governed here.
        # Enumerate workspace-owned packages and test each (same pattern as
        # the fmt/clippy jobs).
        run: |
          set -eo pipefail
          members=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.manifest_path | contains("external/") | not) | .name')
          PKGS=""
          for pkg in $members; do
            PKGS="$PKGS -p $pkg"
          done
          cargo test --all-features $PKGS

      - name: Run doc tests
        run: |
          set -eo pipefail
          members=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.manifest_path | contains("external/") | not) | .name')
          PKGS=""
          for pkg in $members; do
            PKGS="$PKGS -p $pkg"
          done
          cargo test --doc --all-features $PKGS

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace
        run: cargo check --workspace

      - name: Check all features
        run: cargo check --all-features --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        # `cargo clippy --workspace` lints path-dependencies, which for this
        # repo means descending into the `external/siphon-rs` submodule. The
        # submodule is governed separately, so iterate our workspace-owned
        # packages and pass `--no-deps` so each package is linted in
        # isolation. Same approach as the fmt step.
        #
        # The `-A` allow list covers pre-existing stylistic warnings across
        # the workspace that would require broad mechanical rewrites to
        # resolve. We keep the core correctness lints active (as errors via
        # `-D warnings`) but opt out of the purely-cosmetic ones until a
        # dedicated cleanup pass lands.
        run: |
          set -eo pipefail
          members=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.manifest_path | contains("external/") | not) | .name')
          ALLOWS=(
            -A dead_code
            -A clippy::derivable_impls
            -A clippy::too_many_arguments
            -A async_fn_in_trait
            -A clippy::needless_return
            -A clippy::needless_range_loop
            -A clippy::wrong_self_convention
            -A clippy::should_implement_trait
            -A clippy::ptr_arg
            -A clippy::needless_borrows_for_generic_args
            -A clippy::manual_map
            -A clippy::unwrap_or_default
            -A clippy::redundant_pattern_matching
            -A clippy::unnecessary_cast
            -A clippy::assign_op_pattern
            -A clippy::let_and_return
            -A clippy::manual_clamp
            -A clippy::manual_div_ceil
            -A unused_assignments
            -A clippy::incompatible_msrv
            -A clippy::redundant_closure
            -A clippy::doc_lazy_continuation
            -A clippy::io_other_error
            -A clippy::map_identity
            -A clippy::option_map_unit_fn
            -A clippy::ineffective_bit_mask
            -A clippy::redundant_locals
            -A clippy::redundant_slicing
            -A clippy::needless_as_bytes
            -A clippy::borrow_deref_ref
            -A clippy::useless_conversion
            -A clippy::clone_on_copy
            -A clippy::useless_vec
            -A clippy::bool_assert_comparison
            -A clippy::collapsible_if
            -A clippy::collapsible_else_if
            -A clippy::collapsible_match
            -A clippy::let_underscore_future
            -A clippy::new_without_default
            -A clippy::useless_format
            -A clippy::field_reassign_with_default
            -A clippy::single_match
            -A clippy::manual_range_contains
            -A clippy::manual_strip
            -A clippy::or_fun_call
            -A clippy::map_unwrap_or
            -A clippy::ok_expect
            -A clippy::unnecessary_map_or
            -A clippy::unnecessary_unwrap
            -A clippy::useless_asref
            -A clippy::needless_pass_by_value
            -A clippy::large_enum_variant
            -A clippy::type_complexity
            -A clippy::enum_variant_names
            -A clippy::module_inception
            -A clippy::upper_case_acronyms
            -A clippy::mutex_atomic
            -A clippy::question_mark
            -A clippy::items_after_test_module
            -A clippy::unnecessary_sort_by
          )
          for pkg in $members; do
            cargo clippy --no-deps --all-features -p "$pkg" -- -D warnings "${ALLOWS[@]}"
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # `cargo fmt --all` and `cargo fmt` both follow path-dependencies, which
        # in this workspace means recursing into the `external/siphon-rs`
        # submodule. We only own our workspace members, so iterate them
        # explicitly and skip any crate living under external/.
        run: |
          set -eo pipefail
          members=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.manifest_path | contains("external/") | not) | .name')
          for pkg in $members; do
            cargo fmt -p "$pkg" -- --check
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --release --all-features --workspace

      - name: Build binary
        run: cargo build --release --bin forge-media

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate coverage
        # Scope to workspace-owned packages; siphon-rs submodule has its own
        # test infrastructure and is not covered by this repo's coverage run.
        run: |
          set -eo pipefail
          members=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.manifest_path | contains("external/") | not) | .name')
          PKGS=""
          for pkg in $members; do
            PKGS="$PKGS --packages $pkg"
          done
          cargo tarpaulin $PKGS --timeout 300 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  check-features:
    name: Check Feature Combinations
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "recording"
          - "full"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Check features
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --no-default-features --workspace
          else
            cargo check --no-default-features --features "${{ matrix.features }}" --workspace
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        # `--all-features` pulls in `bcg729-sys`, which link-libs against the
        # system `libbcg729`. The codec is packaged on ubuntu as
        # `libbcg729-dev`; also installing `jq` for the workspace-scoping
        # helpers used by fmt/clippy/test/coverage.
        run: |
          sudo apt-get update
          sudo apt-get install -y libbcg729-dev jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --all-features --no-deps --workspace

      - name: Check for broken links
        run: cargo doc --all-features --no-deps --workspace 2>&1 | grep -i "warning.*broken" && exit 1 || exit 0

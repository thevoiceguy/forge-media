# Forge Media Engine Configuration
#
# This file configures the Forge Media Engine including XDP/eBPF acceleration.

[api]
# HTTP API server bind address (default: localhost-only for safety)
# If you change this to a public interface, set auth_tokens and enable HTTPS with tls_cert/tls_key.
http_bind = "127.0.0.1:8080"

# CORS configuration (disabled by default)
enable_cors = false
cors_origins = []

# Authentication tokens (empty = no auth, not recommended for production)
auth_tokens = []

# Rate limiting
rate_limit_requests_per_window = 120
rate_limit_window_secs = 60

# Allowed AI provider endpoints (https/wss only)
ai_allowed_endpoints = ["https://api.openai.com", "https://api.anthropic.com", "https://api.deepgram.com", "https://api.elevenlabs.io"]

# Recording base directory
recording_base_dir = "/tmp/forge-recordings"
# Recording root jail (recording_base_dir must remain within this root)
recording_root_jail = "/tmp"

[engine]
# RTP/RTCP port allocation range
port_range_start = 30000
port_range_end = 40000

# Session timeout in seconds
session_timeout_secs = 300

# TOS/DSCP value for QoS (0xB8 = EF - Expedited Forwarding for voice)
tos = 184

# IP version: "V4Only", "V6Only", or "DualStack"
ip_version = "DualStack"

[engine.mixer]
# Maximum frames to buffer per participant before dropping oldest audio
max_buffer_frames = 50

[engine.xdp]
# Enable XDP/eBPF for sub-10µs RTP packet forwarding
# Requires Linux kernel >= 5.4 and 'xdp' feature compiled
enabled = true

# Network interface to attach XDP program
# Development: "lo" (loopback)
# Production: "eth0", "ens3", etc. (your primary NIC)
interface = "lo"

# XDP mode:
# - "generic": XDP_SKB - software mode, works on all NICs (~50-100µs latency)
# - "native": XDP_DRV - driver mode, requires NIC support (<10µs latency)
mode = "generic"

# Fallback to userspace forwarding if XDP fails to load
# Recommended: true (for compatibility)
fallback = true

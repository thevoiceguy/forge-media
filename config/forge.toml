# Forge Media Engine Configuration
# Part of the Ferrous Communications Platform
#
# This file contains all configurable settings for Forge.
# All settings have sensible defaults and can be overridden as needed.

# =============================================================================
# ENGINE CONFIGURATION
# =============================================================================
[engine]
# RTP/RTCP port range for media sessions
# Ports are allocated in pairs (even for RTP, odd for RTCP)
# Ensure this range provides enough ports for your expected concurrent sessions
# Formula: (end - start) / 2 = max concurrent sessions
port_range = { start = 10000, end = 20000 }  # 5000 concurrent sessions

# TOS/DSCP value for QoS (Type of Service)
# 0xB8 = EF (Expedited Forwarding) for voice
# 0xA0 = AF41 (Assured Forwarding, high priority)
# 0x00 = Best effort (no QoS)
tos = 0xB8

# Session timeout (in seconds)
# Sessions idle for longer than this will be cleaned up
# Format: number in seconds, or human-readable: "5m", "1h", etc.
session_timeout = 300  # 5 minutes

# IP version configuration
# Options: "V4Only", "V6Only", "DualStack", "Bridge4to6", "Bridge6to4"
ip_version = "DualStack"

# Network interfaces configuration
# Multiple interfaces can be configured for different networks
[[engine.interfaces]]
name = "default"
address = "0.0.0.0"
# Optional: Advertised address for NAT scenarios
# advertised_address = "203.0.113.50"

# Example: Additional interface for specific network
# [[engine.interfaces]]
# name = "internal"
# address = "10.0.0.50"
# advertised_address = "203.0.113.50"

# =============================================================================
# API SERVER CONFIGURATION
# =============================================================================
[api]
# HTTP API bind address
# Format: "host:port"
http_bind = "0.0.0.0:8081"

# Enable HTTPS (requires tls_cert and tls_key)
enable_https = false
# https_bind = "0.0.0.0:8443"
# tls_cert = "/etc/forge/certs/server.crt"
# tls_key = "/etc/forge/certs/server.key"

# WebSocket bind address (optional)
# Used for real-time events and streaming
# ws_bind = "0.0.0.0:8082"

# CORS (Cross-Origin Resource Sharing) settings
enable_cors = true
cors_origins = ["*"]  # Use specific origins in production: ["https://example.com"]

# API rate limiting (requests per second per IP)
# rate_limit = 100

# Maximum request body size (in bytes)
# max_body_size = 1048576  # 1MB

# =============================================================================
# SIP SERVER CONFIGURATION (forge-sip-server)
# =============================================================================
[sip]
# SIP server bind address
bind = "0.0.0.0:5060"

# Local IP address for SDP
# This is the IP that will be advertised in SDP offers/answers
local_ip = "192.168.1.81"

# Transport protocols
# Options: ["udp"], ["tcp"], ["udp", "tcp"], ["tls"]
transports = ["udp"]

# Registration expiry (seconds)
registration_expiry = 3600  # 1 hour

# Maximum registered users
# max_registrations = 10000

# Session timers
# session_expires = 1800  # 30 minutes

# TLS settings (if "tls" transport is enabled)
# tls_cert = "/etc/forge/certs/sip.crt"
# tls_key = "/etc/forge/certs/sip.key"
# tls_ca = "/etc/forge/certs/ca.crt"

# =============================================================================
# LOGGING & OBSERVABILITY
# =============================================================================
[logging]
# Log level: "error", "warn", "info", "debug", "trace"
level = "info"

# Log format: "text", "json"
format = "text"

# Log output: "stdout", "stderr", or file path
output = "stdout"

# Enable structured logging with fields
structured = false

# Log file rotation (if output is a file path)
# rotate_size = "100MB"
# rotate_count = 10

[metrics]
# Enable Prometheus metrics endpoint
enable = false
# bind = "0.0.0.0:9090"
# path = "/metrics"

[tracing]
# Enable OpenTelemetry distributed tracing
enable = false
# endpoint = "http://localhost:4317"
# service_name = "forge-media"


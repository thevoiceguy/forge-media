# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
[performance]
# Number of worker threads for async runtime
# Default: number of CPU cores
# worker_threads = 16

# RTP receive buffer size (bytes)
rtp_buffer_size = 1500

# Maximum concurrent sessions per instance
# max_sessions = 1000

# Enable kernel offload (xt_RTPENGINE or eBPF/XDP)
# kernel_offload = false
# kernel_module_path = "/path/to/xt_rtpengine.ko"


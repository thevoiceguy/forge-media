[package]
name = "forge-api"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-engine = { path = "../forge-engine" }
forge-rtp = { path = "../forge-rtp" }
forge-sdp = { path = "../forge-sdp" }
forge-storage = { path = "../forge-storage" }
forge-conference = { path = "../forge-conference" }
forge-siprec = { path = "../forge-siprec" }
forge-webrtc = { path = "../forge-webrtc" }
forge-ice = { path = "../forge-ice" }
forge-ai-stream = { path = "../forge-ai-stream" }
forge-mixer = { path = "../forge-mixer" }
forge-ha = { path = "../forge-ha", optional = true }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"

# Logging and Observability
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true }
lazy_static = "1.5"
validator = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
url = "2.5"
subtle = { workspace = true }

[features]
xdp = ["forge-engine/xdp"]
ha = ["dep:forge-ha", "forge-engine/ha"]
# Re-export forge-engine's opus feature so this package's own
# transcoding tests (gated with `#[cfg(feature = "opus")]`) actually
# compile and run when the workspace is built with `--all-features`.
# Without this, the four opus-gated tests in
# tests/transcoding_tests.rs were silently dead code.
opus = ["forge-engine/opus"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tower = { workspace = true, features = ["util"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }

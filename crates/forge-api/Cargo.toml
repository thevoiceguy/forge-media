[package]
name = "forge-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-engine = { path = "../forge-engine" }
forge-rtp = { path = "../forge-rtp" }
forge-media-processor = { path = "../forge-media-processor" }
forge-storage = { path = "../forge-storage" }
forge-conference-processor = { path = "../forge-conference-processor" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging and Observability
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true }
lazy_static = "1.5"
validator = { workspace = true }

[features]
xdp = ["forge-engine/xdp"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tower = { workspace = true, features = ["util"] }

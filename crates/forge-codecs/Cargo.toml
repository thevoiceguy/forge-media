[package]
name = "forge-codecs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Error handling
thiserror = { workspace = true }

# Lazy initialization
lazy_static = "1.4"

# Opus codec (optional, requires cmake)
audiopus = { version = "0.3.0-rc.0", optional = true }

# G.729 codec (optional, requires libbcg729)
bcg729-sys = { path = "../bcg729-sys", optional = true }

# Logging
tracing = { workspace = true }

[features]
default = []
opus = ["audiopus"]
g722 = []  # Pure Rust implementation, no external dependencies
g729 = ["bcg729-sys"]  # FFI bindings to bcg729 library
all-codecs = ["opus", "g722", "g729"]

[dev-dependencies]

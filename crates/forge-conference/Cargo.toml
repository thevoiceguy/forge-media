[package]
name = "forge-conference"
version = "0.11.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-engine = { path = "../forge-engine" }
forge-mixer = { path = "../forge-mixer" }
forge-recorder = { path = "../forge-recorder" }
forge-rtp = { path = "../forge-rtp" }
# For `H264Fmtp::forwardable_to`: whether one leg's H.264 stream can be
# sent to another leg untouched (§5.6).
forge-sdp = { path = "../forge-sdp" }
forge-video = { path = "../forge-video" }

bytes = { workspace = true }
dashmap = { workspace = true }
hound = "3.5"
metrics = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3.27"

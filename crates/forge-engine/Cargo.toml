[package]
name = "forge-engine"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-hep = { path = "../forge-hep" }
forge-rtp = { path = "../forge-rtp" }
forge-dtmf = { path = "../forge-dtmf" }
forge-vad = { path = "../forge-vad" }
forge-codecs = { path = "../forge-codecs" }
forge-transcoder = { path = "../forge-transcoder" }
forge-ai-stream = { path = "../forge-ai-stream", optional = true }
forge-recorder = { path = "../forge-recorder" }
forge-injection = { path = "../forge-injection" }
forge-ha = { path = "../forge-ha", optional = true }

# XDP support (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
forge-kernel = { path = "../forge-kernel", optional = true }

tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# Optional: Redis for AI session persistence
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = ["g722", "ai"]
xdp = ["forge-kernel"]
opus = ["forge-codecs/opus"]
g722 = ["forge-codecs/g722", "forge-transcoder/g722"]
# AI streaming integration (OpenAI Realtime, Anthropic, Deepgram, ElevenLabs).
# Disabling this drops the `forge-ai-stream` dep, the `ai_integration` and
# `persistence` modules, and the `ai_manager` accessors on `MediaSession` —
# useful for AI-neutral consumers of the media engine.
ai = ["dep:forge-ai-stream"]
# AI session persistence implies the AI module that defines `PersistedAISession`.
persistence-redis = ["ai", "redis"]
ha = ["forge-ha", "forge-rtp/ha"]
# DTLS-SRTP on the SIP-side RTP socket (RFC 5763 / 5764). Enables the
# packet demux in the recv loop and the per-leg DtlsConnection state.
# Pulls in OpenSSL via forge-rtp's `dtls` feature.
dtls = ["forge-rtp/dtls"]

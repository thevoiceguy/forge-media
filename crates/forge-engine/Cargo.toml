[package]
name = "forge-engine"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }
forge-dtmf = { path = "../forge-dtmf" }
forge-codecs = { path = "../forge-codecs" }
forge-transcoder = { path = "../forge-transcoder" }
forge-ai-stream = { path = "../forge-ai-stream" }
forge-ha = { path = "../forge-ha", optional = true }

# XDP support (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
forge-kernel = { path = "../forge-kernel", optional = true }

tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# Optional: Redis for AI session persistence
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
xdp = ["forge-kernel"]
opus = ["forge-codecs/opus"]
persistence-redis = ["redis"]
ha = ["forge-ha", "forge-rtp/ha"]

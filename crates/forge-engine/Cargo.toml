[package]
name = "forge-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }
forge-dtmf = { path = "../forge-dtmf" }
forge-codecs = { path = "../forge-codecs" }

# XDP support (Linux only, optional)
[target.'cfg(target_os = "linux")'.dependencies]
forge-kernel = { path = "../forge-kernel", optional = true }

tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }

[features]
default = []
xdp = ["forge-kernel"]
opus = ["forge-codecs/opus"]

[package]
name = "forge-ice"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }

# Async runtime
tokio = { workspace = true, features = ["net", "time"] }
futures = "0.3"

# Serialization
serde = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Networking
socket2 = { workspace = true }
if-addrs = "0.13"

# Random for STUN transaction IDs
rand = { workspace = true }
hmac = "0.12"
sha1 = "0.10"
# Constant-time comparison for MESSAGE-INTEGRITY HMAC (audit finding C10)
subtle = { workspace = true }

# Utilities
bytes = { workspace = true }
hex = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
hex = "0.4"

[package]
name = "forge-media-processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Opus codec support for audio recording
# Requires: cmake and libopus-dev (or equivalent) to be installed on the system
# Enable with: cargo build --features opus
opus = ["audiopus", "ogg"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }

# Async runtime
tokio = { workspace = true, features = ["fs", "io-util"] }

# Audio processing
symphonia = { workspace = true, features = ["all"] }
rubato = { workspace = true }
audiopus = { version = "0.3.0-rc.0", optional = true }  # Opus encoding/decoding
hound = "3.5"  # WAV file I/O
ogg = { version = "0.8", optional = true }  # Ogg container for Opus

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tempfile = "3.8"

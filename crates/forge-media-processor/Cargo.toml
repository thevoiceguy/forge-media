[package]
name = "forge-media-processor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Codec support (re-exported from forge-codecs)
opus = ["forge-codecs/opus"]
g722 = ["forge-codecs/g722"]
g729 = ["forge-codecs/g729"]
all-codecs = ["opus", "g722", "g729"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }
forge-resampler = { path = "../forge-resampler" }
forge-recorder = { path = "../forge-recorder" }
forge-mixer = { path = "../forge-mixer" }
forge-codecs = { path = "../forge-codecs" }

# Async runtime
tokio = { workspace = true, features = ["fs", "io-util"] }

# Audio processing
symphonia = { workspace = true, features = ["all"] }
rubato = { workspace = true }
hound = "3.5"  # WAV file I/O

# Utilities
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
lazy_static = "1.4"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
tempfile = "3.8"

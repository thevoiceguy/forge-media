[package]
name = "forge-rtmp"
version = "0.1.0"
description = "FLV tags and an RTMP/RTMPS publisher for pushing a stream to a live service, with a stand-in server for tests"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
forge-mp4 = { path = "../forge-mp4" }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# rtmps://: TLS with the platform's roots, on ring named explicitly so the
# process's default provider does not matter.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.13"
forge-codecs = { path = "../forge-codecs", features = ["aac"] }

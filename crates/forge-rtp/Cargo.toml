[package]
name = "forge-rtp"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-ha = { path = "../forge-ha", optional = true }

tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
socket2 = { workspace = true }
metrics = { workspace = true }
rand = { workspace = true }

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Crypto for SRTP
aes = { workspace = true }
aes-gcm = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

# Optional DTLS support
openssl = { version = "0.10", features = ["vendored"], optional = true }
openssl-sys = { version = "0.9", optional = true }
# Must track the foreign-types major that `openssl` itself uses (0.3):
# dtls.rs calls foreign_types::ForeignType on openssl's types, and a
# newer major here is a different trait that openssl's types don't
# implement. Only bump when rust-openssl does.
foreign-types = { version = "0.3", optional = true }

[features]
dtls = ["openssl", "openssl-sys", "foreign-types"]
ha = ["forge-ha"]

[dev-dependencies]
hex = "0.4"

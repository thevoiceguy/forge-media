[package]
name = "forge-video-codecs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native video codec bindings (libvpx, OpenH264, dav1d, SVT-AV1) behind cargo features, implementing forge-video's codec traits"
links = "forge_video_codecs"

[features]
default = []
# VP8 / VP9 encode and decode via the system libvpx (pkg-config `vpx`,
# bindings generated at build time with libclang).
vpx = ["dep:env-libvpx-sys"]
# H.264 encode and decode via OpenH264 built from source (needs nasm and
# a C++ compiler). Cisco's patent grant covers only Cisco's binary.
openh264 = ["dep:openh264"]
# AV1 decode via the system libdav1d (pkg-config `dav1d`).
dav1d = ["dep:dav1d"]
# AV1 encode via the system libsvtav1enc (pkg-config `SvtAv1Enc`,
# bindings generated at build time with libclang).
svt-av1 = ["dep:bindgen", "dep:pkg-config"]
all = ["vpx", "openh264", "dav1d", "svt-av1"]

[dependencies]
forge-core = { path = "../forge-core" }
forge-rtp = { path = "../forge-rtp" }
forge-video = { path = "../forge-video" }

bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

env-libvpx-sys = { version = "5.1.3", features = ["generate"], optional = true }
openh264 = { version = "0.9.8", features = ["source"], optional = true }
dav1d = { version = "0.11.1", optional = true }

[build-dependencies]
bindgen = { version = "0.68", optional = true }
pkg-config = { version = "0.3", optional = true }

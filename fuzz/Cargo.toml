# Its own workspace: cargo-fuzz builds these with a nightly toolchain and
# sanitizer flags that have no business reaching the main workspace, and the
# parent's `exclude` keeps `cargo check --workspace` from trying.
[workspace]

[package]
name = "forge-media-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
forge-core = { path = "../crates/forge-core" }
forge-rtp = { path = "../crates/forge-rtp" }
forge-webm = { path = "../crates/forge-webm" }
forge-mp4 = { path = "../crates/forge-mp4" }
forge-bfcp = { path = "../crates/forge-bfcp" }

# Every target parses attacker-supplied bytes and must not panic on any of
# them. Debug assertions stay on: an overflow or a slice out of bounds should
# be a finding, not a silently wrapped number.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[[bin]]
name = "bfcp_parse"
path = "fuzz_targets/bfcp_parse.rs"
test = false
doc = false

[[bin]]
name = "rtp_extension"
path = "fuzz_targets/rtp_extension.rs"
test = false
doc = false


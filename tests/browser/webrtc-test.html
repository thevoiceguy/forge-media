<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Media - WebRTC Browser Interoperability Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .status.warning {
            background: #fff3e0;
            color: #e65100;
            border-left: 4px solid #e65100;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: #858585;
            margin-right: 10px;
        }

        .log-level {
            font-weight: bold;
            margin-right: 10px;
        }

        .log-level.info { color: #4fc3f7; }
        .log-level.success { color: #81c784; }
        .log-level.error { color: #e57373; }
        .log-level.warning { color: #ffb74d; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
        }

        .stat-label {
            font-size: 12px;
            color: #757575;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        audio {
            flex: 1;
            height: 40px;
        }

        .browser-info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔊 Forge Media WebRTC Test</h1>
            <p>Browser Interoperability Testing Suite</p>
        </div>

        <div class="content">
            <!-- Configuration Section -->
            <div class="section">
                <h2>⚙️ Configuration</h2>
                <div class="form-group">
                    <label for="apiUrl">API URL:</label>
                    <input type="url" id="apiUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
                </div>
                <div class="form-group">
                    <label for="stunServers">STUN Servers (comma-separated):</label>
                    <input type="text" id="stunServers" value="stun:stun.l.google.com:19302"
                           placeholder="stun:stun.l.google.com:19302">
                </div>
                <div class="browser-info" id="browserInfo">
                    Detecting browser...
                </div>
            </div>

            <!-- Connection Section -->
            <div class="section">
                <h2>🔌 Connection</h2>
                <div class="button-group">
                    <button id="connectBtn" onclick="createConnection()">Create Connection</button>
                    <button id="closeBtn" onclick="closeConnection()" disabled>Close Connection</button>
                </div>
                <div id="connectionStatus"></div>
            </div>

            <!-- Media Section -->
            <div class="section">
                <h2>🎵 Media</h2>
                <div class="button-group">
                    <button id="startAudioBtn" onclick="startAudio()" disabled>Start Microphone</button>
                    <button id="stopAudioBtn" onclick="stopAudio()" disabled>Stop Microphone</button>
                </div>
                <div class="audio-controls" id="audioControls" style="display:none;">
                    <audio id="remoteAudio" autoplay controls></audio>
                </div>
                <div id="mediaStatus"></div>
            </div>

            <!-- Statistics Section -->
            <div class="section">
                <h2>📊 Statistics</h2>
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">ICE State</div>
                        <div class="stat-value" id="iceState">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Connection State</div>
                        <div class="stat-value" id="connState">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Candidates</div>
                        <div class="stat-value" id="candidateCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Round Trip Time</div>
                        <div class="stat-value" id="rtt">- ms</div>
                    </div>
                </div>
            </div>

            <!-- Event Log Section -->
            <div class="section">
                <h2>📝 Event Log</h2>
                <button onclick="clearLog()" style="margin-bottom: 10px;">Clear Log</button>
                <div class="log" id="eventLog"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let peerConnection = null;
        let localStream = null;
        let connectionId = null;
        let statsInterval = null;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            detectBrowser();
            log('info', 'Test page loaded and ready');
        });

        // Detect browser
        function detectBrowser() {
            const ua = navigator.userAgent;
            let browser = 'Unknown';
            let version = 'Unknown';

            if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edg') === -1) {
                browser = 'Chrome';
                version = ua.match(/Chrome\/(\d+)/)[1];
            } else if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) {
                browser = 'Safari';
                version = ua.match(/Version\/(\d+)/)[1];
            } else if (ua.indexOf('Firefox') > -1) {
                browser = 'Firefox';
                version = ua.match(/Firefox\/(\d+)/)[1];
            } else if (ua.indexOf('Edg') > -1) {
                browser = 'Edge';
                version = ua.match(/Edg\/(\d+)/)[1];
            }

            document.getElementById('browserInfo').textContent =
                `Browser: ${browser} ${version} | WebRTC Support: ${navigator.mediaDevices ? '✓' : '✗'}`;

            log('info', `Detected: ${browser} ${version}`);
        }

        // Create WebRTC connection
        async function createConnection() {
            try {
                log('info', 'Creating WebRTC connection...');
                setStatus('connectionStatus', 'info', 'Creating connection...');

                const apiUrl = document.getElementById('apiUrl').value;
                const stunServers = document.getElementById('stunServers').value
                    .split(',')
                    .map(s => s.trim())
                    .filter(s => s);

                // Call Forge Media API to create connection
                const response = await fetch(`${apiUrl}/v1/webrtc/connections`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        stun_servers: stunServers
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                connectionId = data.connection_id;

                log('success', `Connection created: ${connectionId}`);
                log('info', `DTLS Fingerprint: ${data.dtls_fingerprint}`);

                // Create local peer connection
                const config = {
                    iceServers: stunServers.map(url => ({ urls: url }))
                };

                peerConnection = new RTCPeerConnection(config);

                // Set up event handlers
                peerConnection.onicecandidate = handleIceCandidate;
                peerConnection.oniceconnectionstatechange = handleIceStateChange;
                peerConnection.onconnectionstatechange = handleConnectionStateChange;
                peerConnection.ontrack = handleTrack;

                // Set remote description (server's offer)
                await peerConnection.setRemoteDescription({
                    type: 'offer',
                    sdp: data.sdp_offer
                });

                log('info', 'Set remote SDP offer');

                // Create and set local answer
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                log('info', 'Created local SDP answer');

                // Send answer to server
                await fetch(`${apiUrl}/v1/webrtc/connections/${connectionId}/answer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sdp_answer: answer.sdp
                    })
                });

                log('success', 'Sent SDP answer to server');

                setStatus('connectionStatus', 'success', 'Connection established!');

                // Update UI
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('closeBtn').disabled = false;
                document.getElementById('startAudioBtn').disabled = false;

                // Start statistics
                startStats();

            } catch (error) {
                log('error', `Connection failed: ${error.message}`);
                setStatus('connectionStatus', 'error', `Error: ${error.message}`);
            }
        }

        // Handle ICE candidate
        async function handleIceCandidate(event) {
            if (event.candidate) {
                log('info', `ICE candidate: ${event.candidate.candidate.substring(0, 50)}...`);

                try {
                    const apiUrl = document.getElementById('apiUrl').value;
                    await fetch(`${apiUrl}/v1/webrtc/connections/${connectionId}/ice-candidate`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            candidate: event.candidate.candidate,
                            sdp_mid: event.candidate.sdpMid,
                            sdp_m_line_index: event.candidate.sdpMLineIndex
                        })
                    });

                    const currentCount = parseInt(document.getElementById('candidateCount').textContent) || 0;
                    document.getElementById('candidateCount').textContent = currentCount + 1;

                } catch (error) {
                    log('error', `Failed to send ICE candidate: ${error.message}`);
                }
            } else {
                log('info', 'ICE gathering complete');
            }
        }

        // Handle ICE state change
        function handleIceStateChange() {
            const state = peerConnection.iceConnectionState;
            document.getElementById('iceState').textContent = state;
            log('info', `ICE state: ${state}`);

            if (state === 'connected' || state === 'completed') {
                setStatus('connectionStatus', 'success', 'ICE connected!');
            } else if (state === 'failed') {
                setStatus('connectionStatus', 'error', 'ICE connection failed');
            }
        }

        // Handle connection state change
        function handleConnectionStateChange() {
            const state = peerConnection.connectionState;
            document.getElementById('connState').textContent = state;
            log('info', `Connection state: ${state}`);
        }

        // Handle incoming track
        function handleTrack(event) {
            log('success', 'Received remote track');
            const remoteAudio = document.getElementById('remoteAudio');
            remoteAudio.srcObject = event.streams[0];
            document.getElementById('audioControls').style.display = 'flex';
        }

        // Start audio
        async function startAudio() {
            try {
                log('info', 'Requesting microphone access...');
                setStatus('mediaStatus', 'info', 'Requesting microphone...');

                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

                log('success', 'Microphone access granted');

                // Add track to peer connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                    log('info', `Added ${track.kind} track to connection`);
                });

                setStatus('mediaStatus', 'success', 'Microphone active');

                document.getElementById('startAudioBtn').disabled = true;
                document.getElementById('stopAudioBtn').disabled = false;

            } catch (error) {
                log('error', `Failed to start audio: ${error.message}`);
                setStatus('mediaStatus', 'error', `Error: ${error.message}`);
            }
        }

        // Stop audio
        function stopAudio() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                log('info', 'Microphone stopped');
                setStatus('mediaStatus', 'info', 'Microphone stopped');

                document.getElementById('startAudioBtn').disabled = false;
                document.getElementById('stopAudioBtn').disabled = true;
            }
        }

        // Close connection
        function closeConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                stopAudio();
            }

            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }

            log('info', 'Connection closed');
            setStatus('connectionStatus', 'info', 'Connection closed');

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('closeBtn').disabled = true;
            document.getElementById('startAudioBtn').disabled = true;
            document.getElementById('stopAudioBtn').disabled = true;

            document.getElementById('iceState').textContent = '-';
            document.getElementById('connState').textContent = '-';
            document.getElementById('candidateCount').textContent = '0';
            document.getElementById('rtt').textContent = '- ms';
        }

        // Start statistics collection
        function startStats() {
            if (statsInterval) {
                clearInterval(statsInterval);
            }

            statsInterval = setInterval(async () => {
                if (!peerConnection) return;

                try {
                    const stats = await peerConnection.getStats();
                    stats.forEach(report => {
                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                            if (report.currentRoundTripTime) {
                                const rtt = (report.currentRoundTripTime * 1000).toFixed(0);
                                document.getElementById('rtt').textContent = `${rtt} ms`;
                            }
                        }
                    });
                } catch (error) {
                    // Ignore stats errors
                }
            }, 1000);
        }

        // Set status message
        function setStatus(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.textContent = message;
            element.style.display = 'block';
        }

        // Log event
        function log(level, message) {
            const logElement = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-level ${level}">${level.toUpperCase()}</span>
                <span>${message}</span>
            `;

            logElement.appendChild(entry);
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Clear log
        function clearLog() {
            document.getElementById('eventLog').innerHTML = '';
            log('info', 'Log cleared');
        }
    </script>
</body>
</html>
